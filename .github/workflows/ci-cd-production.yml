name: CI/CD API Scraper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: tcc-api-scraper
  SERVICE_NAME: api-scraper
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Ajuste se a pasta for diferente no repo do scraper
        working-directory: ./PyScraper_PortalDaTransparencia 
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Instalação do Chrome para testes (CI na nuvem)
      - name: Install Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || true

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          # Se usar playwright nos testes:
          # playwright install --with-deps chromium

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
             export HEADLESS=true
             pytest tests/ -v
          else
             echo "Pasta de testes não encontrada."
          fi

      # BUILD & PUSH
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Owner
        if: github.event_name == 'push'
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Build and Push Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./PyScraper_PortalDaTransparencia
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux] # Runner na VM
    steps:
      - name: Deploy Local
        run: |
          cd ~/tcc-deploy
          echo "⬇Atualizando API Scraper..."
          docker compose pull ${{ env.SERVICE_NAME }}
          docker compose up -d --no-deps ${{ env.SERVICE_NAME }}
          docker image prune -f