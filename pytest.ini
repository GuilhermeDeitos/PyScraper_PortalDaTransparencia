[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
asyncio_mode = auto
markers =
    unit: Testes unitários (fast)
    integration: Testes de integração (médio)
    e2e: Testes end-to-end (slow)
    slow: Testes que demoram mais de 5 segundos